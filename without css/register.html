registration page code:-

<!DOCTYPE html>
<html>

<head>
    <title>Book Recommendation System - Registration</title>
    <link rel="stylesheet" href="with css/register.css">
</head>

<body bgcolor="#F5F5F5">

<center>

<h1>Book Recommendation System Registration</h1>

<hr width="50%">

<form action="login.html">

<table cellpadding="10">

<tr>
    <td>Full Name</td>
    <td><input type="text" placeholder="Enter Full Name" required></td>
</tr>

<tr>
    <td>Email</td>
    <td><input type="email" placeholder="Enter Email" required></td>
</tr>

<tr>
    <td>Username</td>
    <td><input type="text" placeholder="Enter Username" required></td>
</tr>

<tr>
    <td>Password</td>
    <td><input type="password" placeholder="Enter Password" required></td>
</tr>

<tr>
    <td>Confirm Password</td>
    <td><input type="password" placeholder="Confirm Password" required></td>
</tr>

<tr>
    <td colspan="2" align="center">
        <button type="submit">Register</button>
    </td>
</tr>

</table>

</form>

<p>
Already have an account?
<a href="login.html"><b>Login Here</b></a>
</p>

<p>
<a href="index.html">Home</a>
</p>

</center>

</body>

</html>
